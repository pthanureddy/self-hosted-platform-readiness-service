apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: readiness-onprem, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/pthanureddy/self-hosted-platform-readiness-service.git
    targetRevision: main
    path: helm/readiness-service
    helm: {valueFiles: [values.yaml, values-onprem.yaml]}
  destination: {server: https://kubernetes.default.svc, namespace: readiness-onprem}
  syncPolicy:
    automated: {prune: false, selfHeal: false}
    syncOptions: [CreateNamespace=true]

