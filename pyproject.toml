[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "self-hosted-platform-readiness-service"
version = "0.1.0"
description = "Evidence-first readiness analysis for exported self-hosted platform snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thanu Reddy Pathipati", email = "pthanureddy@gmail.com" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "prometheus-client>=0.21,<1",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
readiness = "readiness_service.cli:main"
readiness-deployment-check = "readiness_service.deployment:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readiness_service"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=readiness_service --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["readiness_service"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["readiness_service"]
