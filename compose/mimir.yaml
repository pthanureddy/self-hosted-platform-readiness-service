multitenancy_enabled: false
server: {http_listen_port: 9009}
blocks_storage:
  backend: filesystem
  bucket_store: {sync_dir: /tmp/mimir/tsdb-sync}
  filesystem: {dir: /tmp/mimir/data}
  tsdb: {dir: /tmp/mimir/tsdb}
compactor: {data_dir: /tmp/mimir/compactor}
distributor: {ring: {kvstore: {store: memberlist}}}
ingester: {ring: {replication_factor: 1, kvstore: {store: memberlist}}}
ruler_storage: {backend: filesystem, filesystem: {dir: /tmp/mimir/rules}}

