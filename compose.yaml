name: readiness-observability-lab
services:
  readiness:
    build: .
    image: self-hosted-platform-readiness-service:local
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports: ["8080:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_LEVEL: INFO
    depends_on: [otel-collector]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./compose/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./compose/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./compose/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports: ["3000:3000"]

  mimir:
    image: grafana/mimir:2.15.0
    command: ["-config.file=/etc/mimir/config.yaml"]
    volumes: ["./compose/mimir.yaml:/etc/mimir/config.yaml:ro"]
    profiles: ["full"]

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./compose/loki.yaml:/etc/loki/config.yaml:ro"]
    profiles: ["full"]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes: ["./compose/tempo.yaml:/etc/tempo/config.yaml:ro"]
    profiles: ["full"]

