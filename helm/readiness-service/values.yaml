replicaCount: 2
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/pthanureddy/self-hosted-platform-readiness-service
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
otel:
  endpoint: ""
serviceMonitor:
  enabled: false
  labels: {}
prometheusRule:
  enabled: false
  labels: {}
nodeSelector: {}
tolerations: []
affinity: {}
