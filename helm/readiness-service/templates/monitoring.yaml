{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: readiness-service}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: readiness-service}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
---
{{- end }}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: readiness-service}
spec:
  groups:
    - name: readiness-service
      rules:
        - alert: ReadinessServiceUnavailable
          expr: up{job=~".*readiness-service.*"} == 0
          for: 5m
          labels: {severity: critical}
          annotations: {summary: Readiness service is unavailable}
{{- end }}

