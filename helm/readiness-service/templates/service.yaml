apiVersion: v1
kind: Service
metadata:
  name: {{ include "readiness.fullname" . }}
  labels:
    {{- include "readiness.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "readiness.selectorLabels" . | nindent 4 }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}]
