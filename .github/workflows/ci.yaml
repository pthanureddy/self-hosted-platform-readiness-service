name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]" 'ansible-core>=2.18,<2.20'
      - run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yaml --syntax-check
      - run: bash -n scripts/verify_linux_deployment.sh
      - run: shellcheck scripts/verify_linux_deployment.sh
      - run: bash scripts/verify_linux_deployment.sh
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-deployment-evidence
          path: artifacts/
      - if: always()
        run: sudo journalctl -u readiness-lab --no-pager -n 30 || true

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,otel]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov-report=term-missing --cov-report=xml

  build-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with: {python-version: "3.11"}
      - uses: azure/setup-helm@v5.0.1
        with: {version: v3.16.3}
      - uses: hashicorp/setup-terraform@v4.0.1
        with: {terraform_version: 1.10.4}
      - run: python -m pip install PyYAML
      - run: python scripts/verify_static.py
      - run: docker compose config --quiet
      - run: docker build --tag readiness-service:ci .
      - run: helm lint helm/readiness-service
      - run: |
          for values in values-kind.yaml values-managed.yaml values-dedicated.yaml values-onprem.yaml; do
            helm template readiness helm/readiness-service --values "helm/readiness-service/$values" >/dev/null
          done
          helm template readiness helm/readiness-service \
            --values helm/readiness-service/values-kind.yaml \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            | grep -q 'image: "readiness-service@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
      - working-directory: terraform
        run: terraform fmt -check -recursive
      - working-directory: terraform
        run: terraform init -backend=false
      - working-directory: terraform
        run: terraform validate
      - working-directory: terraform
        run: terraform test

  kind-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: helm/kind-action@v1.15.0
        with: {cluster_name: readiness-ci}
      - uses: azure/setup-helm@v5.0.1
        with: {version: v3.16.3}
      - run: docker build --tag readiness-service:kind .
      - run: kind load docker-image readiness-service:kind --name readiness-ci
      - run: helm install readiness helm/readiness-service --namespace readiness-ci --create-namespace --values helm/readiness-service/values-kind.yaml
      - run: kubectl rollout status deployment/readiness-readiness-service --namespace readiness-ci --timeout=120s
      - name: Exercise deployed API
        run: |
          kubectl port-forward --namespace readiness-ci service/readiness-readiness-service 18080:80 >port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health/ready && break
            sleep 1
          done
          response="$(curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @fixtures/degraded-snapshot.json http://127.0.0.1:18080/v1/analyze)"
          echo "$response" | jq -e '.findings | any(.rule_id == "K8S-001")'
      - if: always()
        run: kubectl get all --namespace readiness-ci && kubectl logs --namespace readiness-ci deployment/readiness-readiness-service || true
